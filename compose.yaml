services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: meeting_notes
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d meeting_notes"]
      interval: 2s
      timeout: 2s
      retries: 15
    volumes:
      - meeting_notes_pgdata:/var/lib/postgresql/data

volumes:
  meeting_notes_pgdata:
